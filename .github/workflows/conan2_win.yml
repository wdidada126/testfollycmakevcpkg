name: conan2 win 2022

on:
  push:
    branches: [ "conan2" ]
  pull_request:
    branches: [ "conan2" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC with vswhere
        shell: cmd
        run: |
          SET VSWhere="C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          FOR /F "tokens=*" %%i IN ('%VSWhere% -latest -property installationPath') DO SET VSInstallDir=%%i
          call "%VSInstallDir%\VC\Auxiliary\Build\vcvars64.bat"
          echo Visual Studio environment activated for x64

      - name: install choco
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

      - name: install conan2
        run: |
          choco install python -y
          echo "cmake version"
          cmake --version
          pip3 install conan==2.12.2
          conan profile detect
          echo "conan2 profiles"
          cp ~/.conan2/profiles/default ~/.conan2/profiles/default_debug_17
          cat ~/.conan2/profiles/default_debug_17
          sed -i 's/Release/Debug/g' ~/.conan2/profiles/default_debug_17
          sed -i 's/14/17/g' ~/.conan2/profiles/default_debug_17
          echo "conan2 profiles"
          cat ~/.conan2/profiles/default_debug_17

      - name: conan build
        run: |
          conan profile list
          conan install . --build=missing -pr=default_debug_17
          cmake --preset conan-default
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}  -j 2 --target all